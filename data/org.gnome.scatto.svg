<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="url(#shine)"/>

  <!-- Stacked snapshots -->
  <rect x="30" y="30" width="68" height="46" rx="8" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="24" y="40" width="68" height="46" rx="8" fill="#ffffff" fill-opacity="0.6"/>
  <g filter="url(#shadow)">
    <rect x="18" y="50" width="68" height="46" rx="8" fill="#ffffff"/>
  </g>
  <!-- Photo motif on the front card -->
  <circle cx="36" cy="64" r="5" fill="#3584e4"/>
  <path d="M18 88 L44 70 L58 80 L68 73 L86 86 V90 a8 8 0 0 1 -8 6 H26 a8 8 0 0 1 -8 -6 Z" fill="#99c1f1"/>

  <!-- Clock badge: schedule -->
  <g filter="url(#shadow)">
    <circle cx="90" cy="88" r="22" fill="#f6f5f4"/>
  </g>
  <circle cx="90" cy="88" r="22" fill="none" stroke="#1a5fb4" stroke-width="4"/>
  <path d="M90 74 V88 L99 94" fill="none" stroke="#1a5fb4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
